name: SDK Compliance Tests

on:
  push:
    branches: [ main ]
    paths:
      - 'posthog/**'
      - 'sdk_compliance_adapter/**'
      - '.github/workflows/sdk-compliance-tests.yml'
  pull_request:
    branches: [ main, 'chore/v4-*', 'feat/v4-*' ]
    paths:
      - 'posthog/**'
      - 'sdk_compliance_adapter/**'
      - '.github/workflows/sdk-compliance-tests.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  pull-requests: write

jobs:
  test-android-sdk:
    uses: PostHog/posthog-sdk-test-harness/.github/workflows/test-sdk-action.yml@129fbb4d2e3de8e8d6890925141b6c7fa3667528
    with:
      adapter-dockerfile: sdk_compliance_adapter/Dockerfile
      adapter-context: .
      test-harness-version: "1.26.0"
      report-name: android-sdk-compliance-report
